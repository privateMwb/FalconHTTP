<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051422"/>
      <stop offset="100%" stop-color="#03100D"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0D9488" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F2A2B" stroke-width="1"/>
    </pattern>

    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#03100D" stop-opacity="0"/>
      <stop offset="100%" stop-color="#03100D" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#fade)"/>

  <!-- left icon: falcon wing, swept back (speed/agility) -->
  <g transform="translate(112,92)" fill="none" stroke="#0D9488" stroke-width="1.8" opacity="0.7" stroke-linecap="round">
    <path d="M4 62 C 20 42, 40 22, 66 4"/>
    <path d="M11 57 C 25 39, 42 24, 59 11"/>
    <path d="M18 51 C 28 39, 40 28, 53 18"/>
    <circle cx="65" cy="4" r="2.5" fill="#0D9488" stroke="none"/>
  </g>

  <!-- right icon: concurrent connections converging into one socket
       (thread-pool serving multiple clients) -->
  <g transform="translate(1024,90)" fill="none" stroke="#22C55E" stroke-width="1.8" opacity="0.7" stroke-linecap="round">
    <line x1="0" y1="6" x2="40" y2="24"/>
    <line x1="0" y1="30" x2="40" y2="30"/>
    <line x1="0" y1="54" x2="40" y2="36"/>
    <circle cx="0" cy="6" r="2.2" fill="#22C55E" stroke="none"/>
    <circle cx="0" cy="30" r="2.2" fill="#22C55E" stroke="none"/>
    <circle cx="0" cy="54" r="2.2" fill="#22C55E" stroke="none"/>
    <circle cx="46" cy="30" r="8"/>
  </g>

  <text x="600" y="155" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="4"
        fill="url(#titleGradient)" filter="url(#glow)">FalconHTTP</text>

  <rect x="400" y="185" width="400" height="2" fill="url(#lineGradient)"/>

  <text x="600" y="220" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" letter-spacing="2" fill="#7FA8A0">EMBEDDED, THREAD-POOL-BACKED HTTP SERVER FOR C++20</text>
</svg>
